<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCAT 18-Day Tracker</title>
<style>
  :root{
    --bg:#0b0b0c; --card:#151517; --card2:#1c1c1f; --border:#2a2a2e;
    --gold:#c9a24b; --gold-dim:#8a723a; --text:#eae7df; --text-dim:#9a978f;
    --green:#4caf6a; --red:#d9534f; --yellow:#e0b84a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Charter','Georgia',serif;
    padding:24px 16px 80px;
  }
  .wrap{max-width:820px; margin:0 auto;}
  header{margin-bottom:24px;}
  h1{font-size:26px; font-weight:600; margin:0 0 4px; letter-spacing:0.3px;}
  .sub{color:var(--text-dim); font-size:14px; margin:0 0 20px;}

  .overview{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px;
  }
  .stat{
    background:var(--card); border:1px solid var(--border); border-radius:6px;
    padding:14px 16px;
  }
  .stat .num{font-size:22px; color:var(--gold); font-weight:600;}
  .stat .label{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;}

  .progress-bar-outer{
    height:6px; background:var(--card2); border-radius:3px; overflow:hidden; margin-bottom:24px;
    border:1px solid var(--border);
  }
  .progress-bar-inner{
    height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold)); width:0%;
    transition:width .3s ease;
  }

  .day{
    background:var(--card); border:1px solid var(--border); border-radius:8px;
    margin-bottom:12px; overflow:hidden;
  }
  .day.fl{ border-color:var(--gold-dim); }
  .day-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; cursor:pointer; user-select:none;
  }
  .day-head:hover{background:var(--card2);}
  .day-title-block{display:flex; align-items:center; gap:10px;}
  .day-num{
    font-size:12px; color:var(--gold); border:1px solid var(--gold-dim);
    border-radius:4px; padding:2px 7px; font-family:sans-serif; letter-spacing:0.5px;
  }
  .day-title{font-size:15px; font-weight:600;}
  .day-date{font-size:12px; color:var(--text-dim); font-weight:400;}
  .day-status{font-size:12px; color:var(--text-dim); font-family:sans-serif; display:flex; align-items:center; gap:8px;}
  .chevron{transition:transform .2s ease; color:var(--text-dim); font-size:12px;}
  .day.open .chevron{transform:rotate(90deg);}

  .day-body{display:none; padding:0 16px 16px;}
  .day.open .day-body{display:block;}

  .task{
    display:flex; align-items:flex-start; gap:10px; padding:7px 0;
    border-bottom:1px solid var(--border); font-size:14px; line-height:1.5;
  }
  .task:last-child{border-bottom:none;}
  .task input[type=checkbox]{
    margin-top:3px; width:15px; height:15px; accent-color:var(--gold); flex-shrink:0; cursor:pointer;
  }
  .task label{cursor:pointer;}
  .task.checked label{color:var(--text-dim); text-decoration:line-through;}

  .fl-scores{
    margin-top:14px; padding-top:14px; border-top:1px solid var(--border);
    display:grid; grid-template-columns:repeat(5,1fr); gap:8px;
  }
  .fl-scores .field{display:flex; flex-direction:column; gap:4px;}
  .fl-scores label{font-size:11px; color:var(--text-dim); font-family:sans-serif; text-transform:uppercase; letter-spacing:0.4px;}
  .fl-scores input{
    background:var(--card2); border:1px solid var(--border); border-radius:4px;
    color:var(--text); padding:6px; font-size:14px; font-family:sans-serif; width:100%;
  }
  .fl-scores input:focus{outline:none; border-color:var(--gold-dim);}

  .notes-box{margin-top:14px; padding-top:14px; border-top:1px solid var(--border);}
  .notes-box label{font-size:11px; color:var(--text-dim); font-family:sans-serif; text-transform:uppercase; letter-spacing:0.4px; display:block; margin-bottom:6px;}
  .notes-box textarea{
    width:100%; min-height:60px; background:var(--card2); border:1px solid var(--border);
    border-radius:4px; color:var(--text); padding:8px; font-family:'Charter','Georgia',serif;
    font-size:13px; resize:vertical;
  }
  .notes-box textarea:focus{outline:none; border-color:var(--gold-dim);}

  .day-progress-mini{
    width:60px; height:4px; background:var(--card2); border-radius:2px; overflow:hidden;
  }
  .day-progress-mini-inner{height:100%; background:var(--gold);}

  footer{margin-top:24px; text-align:center;}
  .reset-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    font-family:sans-serif; font-size:12px; padding:8px 14px; border-radius:5px; cursor:pointer;
  }
  .reset-btn:hover{border-color:var(--red); color:var(--red);}

  .save-indicator{
    position:fixed; bottom:16px; right:16px; font-size:11px; color:var(--text-dim);
    font-family:sans-serif; opacity:0; transition:opacity .3s;
  }
  .save-indicator.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>18-Day MCAT Plan</h1>
    <p class="sub">Aug 24 &ndash; Sep 10 &nbsp;&middot;&nbsp; Exam: September 11</p>
  </header>

  <div class="overview">
    <div class="stat"><div class="num" id="stat-tasks">0/0</div><div class="label">Tasks done</div></div>
    <div class="stat"><div class="num" id="stat-days">0/19</div><div class="label">Days complete</div></div>
    <div class="stat"><div class="num" id="stat-fl">0/4</div><div class="label">Full-lengths logged</div></div>
  </div>

  <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-bar"></div></div>

  <div id="days-container"></div>

  <footer>
    <button class="reset-btn" id="reset-btn">Reset all progress</button>
  </footer>
</div>

<div class="save-indicator" id="save-indicator">Saved</div>

<script>
const PLAN = [
  {id:'d1', num:'Day 1', date:'Aug 24', title:'Bio + Chem videos, 1h UWorld', tasks:[
    'Video: Biology (2h 32m)','Video: Chemistry (1h 51m)','UWorld — 1 hour (Bio + Gen Chem)','MilesDown review sheet (30–45 min, mark red/yellow/green)'
  ]},
  {id:'d2', num:'Day 2', date:'Aug 25', title:'Physics + Orgo videos, 2h UWorld', tasks:[
    'Video: Physics (2h 42m)','Video: Organic Chemistry (3h 29m)','UWorld — 2 hours (Physics + Orgo)','MilesDown review sheet (30 min, equations + reactions)'
  ]},
  {id:'d3', num:'Day 3', date:'Aug 26', title:'Biochem + Psych/Soc videos, 2h UWorld', tasks:[
    'Video: Biochemistry (2h 57m)','Video: Psych/Soc (2h 57m)','UWorld — 2 hours (Biochem + Psych/Soc)','MilesDown review sheet (30–45 min)','Stop broad content review after today'
  ]},
  {id:'d4', num:'Day 4', date:'Aug 27', title:'Full-Length #1', fl:true, tasks:[
    'Wake up at normal test-day time','Take FL under real testing conditions (no phone/music/pauses)','Record section scores only — no deep review tonight'
  ]},
  {id:'d5', num:'Day 5', date:'Aug 28', title:'FL #1 Review', tasks:[
    'Review every wrong question, tag category (A–F)','Build error log entries','UWorld — 1–1.5 hours targeting FL weaknesses'
  ]},
  {id:'d6', num:'Day 6', date:'Aug 29', title:'Weakness Repair', tasks:[
    'UWorld — 2 hours on 2 weakest subjects','MilesDown — 1–1.5 hours (weak areas only)','CARS — 3–5 passages, review reasoning','Psych/Soc — 30–45 min MilesDown'
  ]},
  {id:'d7', num:'Day 7', date:'Aug 30', title:'Question-Heavy Day', tasks:[
    'UWorld — 3 hours (1h CP / 1h BB / 1h PS)','Review every question incl. correct guesses','CARS — 4–6 passages','MilesDown — 45–60 min, error log focus'
  ]},
  {id:'d8', num:'Day 8', date:'Aug 31', title:'Full-Length #2', fl:true, tasks:[
    'Take FL #2 under test-day conditions','Record scores and compare to FL #1'
  ]},
  {id:'d9', num:'Day 9', date:'Sep 1', title:'FL #2 Review', tasks:[
    'Review FL #2, compare mistakes to FL #1','Identify repeated mistakes','Build Top 10 Weaknesses list'
  ]},
  {id:'d10', num:'Day 10', date:'Sep 2', title:'Targeted UWorld', tasks:[
    'UWorld — 3 hours using Top 10 weakness list','Content repair — 1–2 hours (MilesDown/videos/notes)','CARS — 5 passages','PS terminology review — 30 min'
  ]},
  {id:'d11', num:'Day 11', date:'Sep 3', title:'High-Volume Practice', tasks:[
    'UWorld — 3–4 hours (~60–90 questions)','CARS — 5–6 passages','MilesDown — 45 min','Night: review error log for repeated mistakes'
  ]},
  {id:'d12', num:'Day 12', date:'Sep 4', title:'Full-Length #3', fl:true, tasks:[
    'Take FL #3 under test-day conditions','Record scores, check for upward trend'
  ]},
  {id:'d13', num:'Day 13', date:'Sep 5', title:'FL #3 Review', tasks:[
    'Review every wrong/guessed question','Add Timing category to error analysis (finish? rush? flagged review time?)'
  ]},
  {id:'d14', num:'Day 14', date:'Sep 6', title:'Attack Biggest Weakness', tasks:[
    'Customize study block based on FL #3 weakest section(s)','Targeted content review + UWorld for weak section','CARS — 4–6 passages'
  ]},
  {id:'d15', num:'Day 15', date:'Sep 7', title:'Final Big Question Day', tasks:[
    'UWorld — 3–4 hours (weakest → 2nd weakest → mixed)','CARS — 5 passages','MilesDown — 1 hour','Full error log review'
  ]},
  {id:'d16', num:'Day 16', date:'Sep 8', title:'Full-Length #4 (Final FL)', fl:true, tasks:[
    'Replicate real test-day conditions exactly (wake time, breakfast, caffeine, breaks)','Treat as dress rehearsal, not practice'
  ]},
  {id:'d17', num:'Day 17', date:'Sep 9', title:'Final FL Review', tasks:[
    'Review repeated mistakes, high-yield concepts, equations','Cover: amino acids, metabolism, psych/soc terms, physics relationships, orgo reactions, experimental design','UWorld — 1–2 hours, targeted only'
  ]},
  {id:'d18', num:'Day 18', date:'Sep 10', title:'Light Review / Rest (Day Before)', tasks:[
    'Morning: MilesDown review sheet (~2 hours)','CARS — 2–3 easy/medium passages only','Afternoon: review personal error log','Evening: stop studying — prep ID, snacks, water, clothes, caffeine','Go to bed early'
  ]},
  {id:'exam', num:'Exam Day', date:'Sep 11', title:'MCAT', tasks:[
    'Execute, don\\'t learn — one passage at a time','Read → Understand → Eliminate → Answer → Move'
  ]},
];

const FL_DAYS = ['d4','d8','d12','d16'];
const STORAGE_KEY = 'mcat-tracker-state';
let state = { tasks:{}, fl:{}, notes:{}, open:{} };

function saveState(){
  window.storage.set(STORAGE_KEY, JSON.stringify(state), false).catch(()=>{});
  const ind = document.getElementById('save-indicator');
  ind.classList.add('show');
  clearTimeout(window._saveTimeout);
  window._saveTimeout = setTimeout(()=>ind.classList.remove('show'), 1200);
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign({tasks:{}, fl:{}, notes:{}, open:{}}, parsed);
    }
  }catch(e){ /* no saved state yet */ }
}

function render(){
  const container = document.getElementById('days-container');
  container.innerHTML = '';
  PLAN.forEach(day=>{
    const el = document.createElement('div');
    el.className = 'day' + (day.fl ? ' fl' : '') + (state.open[day.id] ? ' open' : '');

    const checkedCount = day.tasks.filter((_,i)=>state.tasks[day.id+'-'+i]).length;
    const total = day.tasks.length;
    const pct = total ? Math.round((checkedCount/total)*100) : 0;

    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML = `
      <div class="day-title-block">
        <span class="day-num">${day.num}</span>
        <span class="day-title">${day.title} <span class="day-date">— ${day.date}</span></span>
      </div>
      <div class="day-status">
        <span>${checkedCount}/${total}</span>
        <div class="day-progress-mini"><div class="day-progress-mini-inner" style="width:${pct}%"></div></div>
        <span class="chevron">&#9656;</span>
      </div>
    `;
    head.addEventListener('click', ()=>{
      state.open[day.id] = !state.open[day.id];
      saveState();
      render();
    });

    const body = document.createElement('div');
    body.className = 'day-body';

    day.tasks.forEach((t,i)=>{
      const key = day.id+'-'+i;
      const checked = !!state.tasks[key];
      const taskEl = document.createElement('div');
      taskEl.className = 'task' + (checked ? ' checked' : '');
      const cbId = 'cb-'+key;
      taskEl.innerHTML = `<input type="checkbox" id="${cbId}" ${checked?'checked':''}><label for="${cbId}">${t}</label>`;
      taskEl.querySelector('input').addEventListener('change', (e)=>{
        state.tasks[key] = e.target.checked;
        saveState();
        render();
      });
      body.appendChild(taskEl);
    });

    if(FL_DAYS.includes(day.id)){
      const scoreBlock = document.createElement('div');
      scoreBlock.className = 'fl-scores';
      const fields = [['cp','CP'],['cars','CARS'],['bb','BB'],['ps','PS'],['total','Total']];
      fields.forEach(([key,label])=>{
        const val = (state.fl[day.id] && state.fl[day.id][key]) || '';
        const wrap = document.createElement('div');
        wrap.className = 'field';
        wrap.innerHTML = `<label>${label}</label><input type="text" inputmode="numeric" value="${val}" placeholder="—">`;
        wrap.querySelector('input').addEventListener('input', (e)=>{
          if(!state.fl[day.id]) state.fl[day.id] = {};
          state.fl[day.id][key] = e.target.value;
          saveState();
          updateStats();
        });
        scoreBlock.appendChild(wrap);
      });
      body.appendChild(scoreBlock);
    }

    const notesBlock = document.createElement('div');
    notesBlock.className = 'notes-box';
    notesBlock.innerHTML = `<label>Notes / error log</label><textarea placeholder="What went wrong, what to fix...">${state.notes[day.id]||''}</textarea>`;
    notesBlock.querySelector('textarea').addEventListener('input', (e)=>{
      state.notes[day.id] = e.target.value;
      saveState();
    });
    body.appendChild(notesBlock);

    el.appendChild(head);
    el.appendChild(body);
    container.appendChild(el);
  });

  updateStats();
}

function updateStats(){
  let totalTasks = 0, doneTasks = 0, daysComplete = 0;
  PLAN.forEach(day=>{
    let dayDone = 0;
    day.tasks.forEach((_,i)=>{
      totalTasks++;
      if(state.tasks[day.id+'-'+i]){ doneTasks++; dayDone++; }
    });
    if(dayDone === day.tasks.length) daysComplete++;
  });
  const flLogged = FL_DAYS.filter(id => state.fl[id] && state.fl[id].total).length;

  document.getElementById('stat-tasks').textContent = `${doneTasks}/${totalTasks}`;
  document.getElementById('stat-days').textContent = `${daysComplete}/${PLAN.length}`;
  document.getElementById('stat-fl').textContent = `${flLogged}/4`;
  document.getElementById('progress-bar').style.width = totalTasks ? `${Math.round((doneTasks/totalTasks)*100)}%` : '0%';
}

document.getElementById('reset-btn').addEventListener('click', ()=>{
  if(confirm('Reset all progress? This clears every checkbox, score, and note.')){
    state = { tasks:{}, fl:{}, notes:{}, open:{} };
    saveState();
    render();
  }
});

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
